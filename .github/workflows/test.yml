name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The extension imports real values from the pi packages (not just types),
      # and the suite loads the .ts sources through jiti, which ships inside pi
      # rather than being a dependency here. See test/jiti.mjs.
      - run: npm install --no-save jiti @earendil-works/pi-coding-agent @earendil-works/pi-tui

      - run: node test/parity.mjs
